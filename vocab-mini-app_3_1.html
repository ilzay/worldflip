<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WordFlip — учи слова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070f0c;
  --bg2:#0a1712;
  --s1:#0f1d16;
  --s2:#14271d;
  --s3:#1b3326;
  --border:rgba(120,220,180,0.09);
  --border2:rgba(120,220,180,0.18);
  --acc:#34e6ab;
  --acc2:#86f5d0;
  --acc3:#c5fce8;
  --acc-dim:rgba(52,230,171,0.13);
  --gold:#ffd56b;
  --gold-dim:rgba(255,213,107,0.14);
  --red:#ff8189;
  --blue:#6bb8ff;
  --text:#eaf6f0;
  --muted:#84a89a;
  --muted2:#4d6a5f;
  --r:14px;
  --r2:20px;
  --r3:26px;
  --nav-h:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);font-size:clamp(14px,3.8vw,16px)}

/* ── BG ── */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 80% 50% at 50% -10%,rgba(52,230,171,.10),transparent 60%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(107,184,255,.05),transparent 60%),
  linear-gradient(180deg,var(--bg2),var(--bg))}
.bg-grid::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(52,230,171,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(52,230,171,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at 50% 0%,black 0%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,black 0%,transparent 78%)}

/* ── SHELL ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:clamp(12px,3vw,20px) clamp(10px,3vw,16px) calc(var(--nav-h) + 20px);display:none;flex-direction:column;gap:clamp(10px,2.5vw,16px);scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.active{display:flex}
.page>*{flex-shrink:0}

/* ── NAV ── */
.nav{display:flex;background:rgba(16,29,23,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));position:absolute;bottom:0;left:0;right:0;z-index:10;min-height:var(--nav-h)}
.nav-btn{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;font-size:clamp(8px,2.4vw,10px);font-weight:600;color:var(--muted2);background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:color .2s;min-width:0;overflow:hidden;white-space:nowrap}
.nav-btn svg{width:clamp(18px,5vw,21px);height:clamp(18px,5vw,21px);stroke-width:2;transition:all .2s}
.nav-btn.active{color:var(--acc)}
.nav-btn.active svg{filter:drop-shadow(0 0 10px rgba(52,230,171,.7))}
.nav-btn::before{content:'';position:absolute;top:6px;width:34px;height:3px;border-radius:3px;background:var(--acc);opacity:0;transform:scaleX(.4);transition:all .25s}
.nav-btn.active::before{opacity:1;transform:scaleX(1)}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;flex-wrap:nowrap}
.hdr-title{font-family:'Unbounded',sans-serif;font-size:clamp(18px,5.2vw,23px);font-weight:800;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:linear-gradient(120deg,var(--text),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-title .dot{-webkit-text-fill-color:var(--acc);color:var(--acc)}
.badge{background:var(--s2);border:1px solid var(--border2);border-radius:30px;padding:4px 11px;font-size:clamp(10px,2.8vw,12px);font-weight:600;color:var(--acc2);white-space:nowrap;flex-shrink:0}

/* ── ADD FORM ── */
.card{background:linear-gradient(160deg,rgba(20,39,29,.9),rgba(15,29,22,.9));border:1px solid var(--border2);border-radius:var(--r3);padding:clamp(13px,3.8vw,17px);display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.03);flex-shrink:0}
.lbl{font-size:clamp(9px,2.4vw,10px);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-left:2px}
.inp{width:100%;background:var(--s3);border:1.5px solid transparent;border-radius:var(--r);padding:clamp(11px,3vw,14px) clamp(12px,3.5vw,16px);color:var(--text);font-size:clamp(15px,4vw,16px);font-family:'Inter',sans-serif;font-weight:600;outline:none;transition:all .2s;min-width:0}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
.inp::placeholder{color:var(--muted2);font-weight:500}

/* suggestions */
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{background:var(--s3);border:1.5px solid var(--border2);border-radius:30px;padding:clamp(6px,1.8vw,8px) clamp(11px,3.2vw,15px);font-size:clamp(12px,3.4vw,14px);font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc2)}
.t9{display:flex;align-items:center;background:var(--acc-dim);border:1.5px dashed rgba(45,224,165,.35);border-radius:var(--r);padding:clamp(7px,2vw,9px) clamp(11px,3vw,14px);cursor:pointer;width:100%;transition:background .15s;min-width:0;overflow:hidden}
.t9:active{background:rgba(45,224,165,.25)}
.t9 b{font-size:clamp(13px,3.6vw,15px);color:var(--text);font-weight:700;white-space:nowrap}
.t9 i{font-size:clamp(13px,3.6vw,15px);color:var(--acc);font-weight:700;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t9 .key{margin-left:auto;font-size:9px;color:var(--muted);background:var(--s3);border-radius:5px;padding:2px 6px;flex-shrink:0}
.hint{font-size:clamp(11px,3vw,13px);color:var(--muted2);padding:2px}

.sel{display:flex;align-items:center;gap:8px;background:var(--acc-dim);border:1px solid rgba(45,224,165,.3);border-radius:var(--r);padding:clamp(8px,2.4vw,11px) clamp(11px,3vw,14px);min-width:0}
.sel .s-lbl{font-size:clamp(10px,2.6vw,11px);color:var(--muted);flex-shrink:0}
.sel .s-val{font-weight:700;font-size:clamp(13px,3.6vw,15px);color:var(--acc2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel .s-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px;flex-shrink:0}

.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--r);color:#04120c;font-size:clamp(13px,3.8vw,15px);font-weight:800;font-family:'Inter',sans-serif;padding:clamp(12px,3.4vw,15px);cursor:pointer;width:100%;transition:all .15s;opacity:.4;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 16px rgba(52,230,171,.25)}
.btn.on{opacity:1;pointer-events:all}
.btn:active{transform:scale(.97)}
.btn-ghost{background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:clamp(13px,3.6vw,15px);font-weight:700;font-family:'Inter',sans-serif;padding:clamp(11px,3vw,13px) clamp(18px,5vw,28px);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-ghost:active{transform:scale(.97);border-color:var(--acc)}

/* ── WORD LIST ── */
.wlist{display:flex;flex-direction:column;gap:7px;min-width:0}
.witem{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:clamp(10px,2.8vw,13px) clamp(10px,3vw,13px);display:flex;align-items:center;gap:clamp(6px,2vw,10px);animation:up .25s ease;min-width:0}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.w-n{font-size:clamp(9px,2.4vw,11px);font-weight:700;color:var(--muted2);min-width:16px;text-align:center;flex-shrink:0}
.w-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--muted2)}
.w-dot.new{background:var(--muted2)}
.w-dot.mid{background:var(--gold)}
.w-dot.done{background:var(--acc);box-shadow:0 0 8px rgba(52,230,171,.5)}
.w-en{font-weight:700;font-size:clamp(13px,3.6vw,15px);flex:1 1 40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-ru{font-size:clamp(11px,3.2vw,13px);color:var(--muted);flex:1 1 40%;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-x{background:none;border:none;cursor:pointer;color:var(--muted2);padding:4px;flex-shrink:0;transition:color .15s}
.w-x:active{color:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:clamp(12px,3.4vw,14px);padding:48px 16px;line-height:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .e-ico{font-size:clamp(32px,9vw,42px);opacity:.6}

/* ── FLASHCARDS ── */
.prog{width:100%;display:flex;flex-direction:column;gap:5px}
.prog-t{width:100%;height:4px;background:var(--s3);border-radius:2px;overflow:hidden}
.prog-f{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:width .4s ease}
.prog-m{display:flex;justify-content:space-between;font-size:clamp(9px,2.6vw,11px);font-weight:600;color:var(--muted)}

.scene{width:100%;height:clamp(170px,46vw,220px);perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none}
.cin{width:100%;height:100%;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform}
.cin.fl{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.cf{position:absolute;inset:0;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:clamp(16px,5vw,28px);gap:8px;overflow:hidden;-webkit-transform:translateZ(0);transform:translateZ(0)}
.cf.f1{background:linear-gradient(155deg,#18301f,#0f2118);border:1px solid var(--border2);z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.cf.f2{background:linear-gradient(155deg,#13301f,#0c2418);border:1px solid rgba(52,230,171,.3);-webkit-transform:rotateY(180deg) translateZ(0);transform:rotateY(180deg) translateZ(0);z-index:1;box-shadow:inset 0 1px 0 rgba(52,230,171,.1)}
.c-chip{font-size:clamp(8px,2.2vw,10px);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.c-word{font-family:'Unbounded',sans-serif;font-size:clamp(20px,6.5vw,30px);font-weight:600;text-align:center;line-height:1.25;word-break:break-word;max-width:100%}
.cf.f2 .c-word{color:var(--acc2)}
.c-tap{font-size:clamp(9px,2.6vw,11px);color:var(--muted2);display:flex;align-items:center;gap:4px}

.row2{display:flex;gap:8px;width:100%;min-width:0}
.act{flex:1 1 0;padding:clamp(11px,3.2vw,14px) 6px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--s1);font-size:clamp(11px,3.2vw,13px);font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;white-space:nowrap;min-width:0;overflow:hidden}
.act.ok{border-color:rgba(45,224,165,.3);color:var(--acc)}
.act.ok:active{background:var(--acc-dim);transform:scale(.96)}
.act.no{border-color:rgba(255,123,123,.3);color:var(--red)}
.act.no:active{background:rgba(255,123,123,.08);transform:scale(.96)}

/* ── QUIZ ── */
.q-hd{display:flex;gap:5px;flex-shrink:1;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.q-s{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:clamp(10px,2.8vw,12px);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.q-s.g{color:var(--acc)}
.q-s.r{color:var(--red)}
.q-duel{background:var(--gold-dim);border:1px solid rgba(255,213,107,.3);border-radius:20px;padding:4px 11px;font-size:clamp(10px,2.8vw,12px);font-weight:700;font-family:'Inter',sans-serif;color:var(--gold);cursor:pointer;white-space:nowrap;transition:transform .15s}
.q-duel:active{transform:scale(.94)}
.leveltest-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:linear-gradient(135deg,rgba(107,184,255,.14),rgba(52,230,171,.08));border:1px solid rgba(107,184,255,.3);border-radius:var(--r2);padding:clamp(12px,3.5vw,16px);cursor:pointer;transition:transform .15s;color:var(--text);font-family:'Inter',sans-serif;text-align:left;flex-shrink:0}
.leveltest-bar:active{transform:scale(.985)}
.lt-i{min-width:0;flex:1}
.lt-t{font-weight:800;font-size:clamp(13px,3.8vw,15px)}
.lt-s{font-size:clamp(10px,2.9vw,12px);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leveltest-bar svg{color:var(--blue);flex-shrink:0}
.lt-result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 10px}
.lt-badge{font-family:'Unbounded',sans-serif;font-size:clamp(44px,13vw,60px);font-weight:800;line-height:1;background:linear-gradient(135deg,var(--acc),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lt-name{font-size:clamp(15px,4.4vw,19px);font-weight:800}
.lt-desc{font-size:clamp(12px,3.4vw,14px);color:var(--muted);line-height:1.7;max-width:300px}
.lt-bar2{width:100%;max-width:300px;height:8px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:4px}
.lt-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--blue));border-radius:4px}
.lt-scale{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:10px;color:var(--muted2);font-weight:700;margin-top:-8px}
.lt-prog{font-size:clamp(11px,3vw,13px);color:var(--muted);font-weight:600}
.q-card{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r2);padding:clamp(20px,6vw,30px) clamp(14px,4vw,20px);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.q-sub{font-size:clamp(9px,2.4vw,11px);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.q-word{font-family:'Unbounded',sans-serif;font-size:clamp(20px,7vw,32px);font-weight:600;text-align:center;line-height:1.2;word-break:break-word;max-width:100%}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.q-o{background:var(--s2);border:1.5px solid var(--border);border-radius:var(--r);padding:clamp(11px,3.2vw,14px) clamp(6px,2vw,10px);font-size:clamp(12px,3.4vw,14px);font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;text-align:center;transition:all .15s;font-weight:600;line-height:1.35;word-break:break-word;min-width:0}
.q-o:active{transform:scale(.97)}
.q-o.c{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.q-o.w{border-color:var(--red);background:rgba(255,123,123,.08);color:var(--red)}
.q-fb{font-size:clamp(12px,3.4vw,14px);font-weight:700;min-height:20px;text-align:center;word-break:break-word}
.q-fb.g{color:var(--acc)}
.q-fb.r{color:var(--red)}
.q-type{text-align:center;font-size:clamp(15px,4.2vw,17px)}
.q-type.wrong{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(255,129,137,.15)!important}

/* ── RESULT ── */
.res{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:36px 12px;text-align:center}
.res-e{font-size:clamp(44px,13vw,60px);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.res-t{font-family:'Unbounded',sans-serif;font-size:clamp(17px,5vw,24px);font-weight:800}
.res-s{color:var(--muted);font-size:clamp(12px,3.4vw,14px);line-height:1.8}
.res-row{display:flex;gap:12px}
.res-st{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:clamp(10px,3vw,14px) clamp(14px,4.5vw,22px)}
.res-n{font-family:'Unbounded',sans-serif;font-size:clamp(20px,6vw,28px);font-weight:800}
.res-l{font-size:clamp(8px,2.2vw,10px);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.res-st.g .res-n{color:var(--acc)}
.res-st.r .res-n{color:var(--red)}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-share{background:linear-gradient(135deg,var(--blue),#8fc9ff);border:none;border-radius:var(--r);color:#04121e;font-size:clamp(13px,3.6vw,15px);font-weight:800;font-family:'Inter',sans-serif;padding:clamp(11px,3vw,13px) clamp(16px,5vw,24px);cursor:pointer;transition:all .15s;white-space:nowrap;box-shadow:0 4px 16px rgba(107,184,255,.25)}
.btn-share:active{transform:scale(.96)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(14px);background:rgba(22,38,30,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:30px;padding:10px 20px;font-size:clamp(11px,3.2vw,13px);font-weight:600;color:var(--text);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.2,.64,1);z-index:999;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.nocards{text-align:center;color:var(--muted);font-size:clamp(12px,3.4vw,14px);padding:44px 16px;line-height:2}
.imp-area{min-height:110px;resize:vertical;font-weight:500;line-height:1.6;font-family:'Inter',sans-serif}
.goal-card{background:linear-gradient(150deg,rgba(52,230,171,.1),rgba(15,29,22,.6));border:1px solid var(--border2);border-radius:var(--r3);padding:clamp(14px,4vw,18px);display:flex;align-items:center;gap:clamp(12px,4vw,18px);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.goal-ring{width:clamp(72px,20vw,84px);height:clamp(72px,20vw,84px);flex-shrink:0}
.goal-i{min-width:0;flex:1}
.goal-t{font-size:clamp(13px,3.6vw,15px);font-weight:700}
.goal-s{font-size:clamp(11px,3.2vw,13px);color:var(--muted);margin-top:2px}
.goal-set{display:flex;gap:6px;margin-top:8px}
.gbtn{background:var(--s3);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:clamp(11px,3vw,13px);font-weight:700;font-family:'Inter',sans-serif;padding:5px 12px;cursor:pointer;transition:all .15s}
.gbtn:active{background:var(--acc-dim);border-color:var(--acc);color:var(--acc2)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat-b{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:clamp(12px,3.5vw,16px);text-align:center;min-width:0}

.streak-sub{font-size:clamp(11px,3.2vw,13px);color:var(--muted)}

.spk svg{width:55%;height:55%}
.center{display:flex;justify-content:center}

<body>
<div class="bg-grid"></div>
<div class="app">
  <div class="pages">

    <!-- ADD -->
    <div class="page active" id="page-add">
      <div class="hdr">
        <div class="hdr-title">WordFlip<span class="dot">.</span></div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <div class="badge streak" id="streak-b" style="display:none">🔥 <span id="streak-n">0</span></div>
          <div class="badge" id="cnt">0 слов</div>
        </div>
      </div>
      <div class="wotd" id="wotd" onclick="addWotd()">
        <div class="wotd-glow"></div>
        <div class="wotd-top">
          <span class="wotd-tag">✦ Слово дня</span>
          <button class="wotd-spk" onclick="event.stopPropagation();speak(document.getElementById('wotd-en').textContent)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
          </button>
        </div>
        <div class="wotd-en" id="wotd-en">—</div>
        <div class="wotd-ru" id="wotd-ru"></div>
        <div class="wotd-ex" id="wotd-ex"></div>
        <div class="wotd-add" id="wotd-add">Нажми, чтобы добавить в свой список →</div>
      </div>
      <div class="card">
        <div>
          <div class="lbl">Слово</div>
          <input class="inp" id="in-en" placeholder="Напиши слово на английском" autocomplete="off" spellcheck="false" oninput="onInput(this.value)">
        </div>
        <div id="sug-box" style="display:none">
          <div class="lbl" style="margin-bottom:6px">Выбери перевод</div>
          <div class="chips" id="sug-chips"></div>
        </div>
        <div id="sel-box" style="display:none">
          <div class="sel">
            <span class="s-lbl">Перевод:</span>
            <span class="s-val" id="sel-val"></span>
            <button class="s-x" onclick="clearSel()">×</button>
          </div>
        </div>
        <button class="btn" id="btn-add" onclick="addWord()">Добавить</button>
      </div>
      <button class="sets-toggle" onclick="toggleSets()">
        <span>📦 Готовые наборы слов</span>
        <svg id="sets-arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="sets-box" style="display:none"></div>
      <button class="sets-toggle" onclick="toggleImport()">
        <span>📥 Импорт списком</span>
        <svg id="imp-arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="imp-box" style="display:none">
        <div class="card" style="gap:8px">
          <div class="hint" style="margin:0">Каждое слово с новой строки, формат: <b>cat - кошка</b><br>Разделитель: тире, дефис или двоеточие.</div>
          <textarea class="inp imp-area" id="imp-text" placeholder="cat - кошка&#10;dog - собака&#10;run - бежать"></textarea>
          <button class="btn on" onclick="doImport()">Импортировать</button>
        </div>
      </div>
      <div class="wlist" id="wlist"></div>
    </div>

    <!-- FLASH -->
    <div class="page" id="page-flash">
      <div class="hdr">
        <div class="hdr-title">Карточки</div>
        <div class="badge" id="f-cnt"></div>
      </div>
      <div id="f-body"></div>
    </div>

    <!-- QUIZ -->
    <div class="page" id="page-quiz">
      <div class="hdr">
        <div class="hdr-title">Тест</div>
        <div class="q-hd">
          <button class="q-duel" onclick="startDuel()">⚔️ Дуэль</button>
          <div class="q-s g">✓ <span id="qc">0</span></div>
          <div class="q-s r">✗ <span id="qw">0</span></div>
        </div>
      </div>
      <button class="leveltest-bar" onclick="startLevelTest()">
        <div class="lt-i">
          <div class="lt-t">🎯 Узнать свой уровень</div>
          <div class="lt-s" id="lt-sub">Пройди тест и узнай свой уровень английского</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div id="q-body"></div>
    </div>

    <!-- PROFILE -->
    <div class="page" id="page-prof">
      <div class="hdr"><div class="hdr-title">Профиль</div></div>
      <div id="prof-body"></div>
    </div>

  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="nav('add',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Слова
    </button>
    <button class="nav-btn" onclick="nav('flash',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M8 12h8" stroke-linecap="round"/></svg>
      Карточки
    </button>
    <button class="nav-btn" onclick="nav('quiz',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01" stroke-linecap="round"/></svg>
      Тест
    </button>
    <button class="nav-btn" onclick="nav('prof',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </button>
  </nav>
</div>
<div class="streak-pop" id="streak-pop" onclick="hideStreakPop()">
  <div class="streak-card">
    <div class="streak-fire">🔥</div>
    <div class="streak-num" id="sp-num"></div>
    <div class="streak-lbl" id="sp-lbl"></div>
    <div class="streak-sub" id="sp-sub">Возвращайся завтра, чтобы продолжить серию</div>
  </div>
</div>
<div class="cheer" id="cheer"></div>
<div class="toast" id="toast"></div>

<script>

function lookupWord(w) {
  const key = w.trim().toLowerCase();
  if (!key) return null;
  if (DICT[key]) return { translations: DICT[key], fullWord: key };
  const matches = Object.keys(DICT).filter(k => k.startsWith(key)).sort((a,b) => a.length - b.length);
  if (matches.length) return { translations: DICT[matches[0]], fullWord: matches[0] };
  return null;
}

function toggleImport() {
  const box = document.getElementById('imp-box');
  const btn = box.previousElementSibling;
  const open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  btn.classList.toggle('open', open);
}

function doImport() {
  const raw = document.getElementById('imp-text').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    const m = line.split(/\s*[-–—:]\s*/);
    if (m.length >= 2) {
      const en = m[0].trim();
      const ru = m.slice(1).join(' ').trim();
      if (en && ru && !words.some(w => w.en.toLowerCase() === en.toLowerCase())) {
        words.push({ id: Date.now() + Math.random(), en: en.charAt(0).toUpperCase() + en.slice(1), ru, lvl: 0, seen: 0, correct: 0 });
        added++;
      }
    }
  });
  if (added) {
    save(); renderList();
    document.getElementById('imp-text').value = '';
    document.getElementById('imp-box').style.display = 'none';
    toast('Импортировано ' + added + ' ' + plural(added,'слово','слова','слов'));
    haptic('ok'); bumpStreak();
  } else toast('Не нашёл новых слов — проверь формат');
}

  const s = SETS.find(x => x.id === id);
  if (!s) return;
  let added = 0;
  s.words.forEach(([en, ru]) => {

      words.push({ id: Date.now() + Math.random(), en: en.charAt(0).toUpperCase() + en.slice(1), ru, lvl: 0, seen: 0, correct: 0 });
      added++;
    }
  });
  if (added) { save(); renderList(); toast('Добавлено ' + added + ' ' + plural(added,'слово','слова','слов')); haptic('ok'); }
  else toast('Все слова уже добавлены');
  renderSets();
}

// ── SRS (интервальное повторение) ──
function ensureSrs(w){ if(w.lvl===undefined)w.lvl=0; if(w.seen===undefined)w.seen=0; if(w.correct===undefined)w.correct=0; return w; }

function markWord(id, knew) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  ensureSrs(w);
  logActivity(1);
  w.seen++;
  if (knew) { w.correct++; w.lvl = Math.min(5, w.lvl + 1); }
  else { w.lvl = Math.max(0, w.lvl - 1); }
  save();
}

// weighted order: low level (weak) words come first, with some randomness
function srsOrder(pool) {
  return [...pool].map(w => {
    ensureSrs(w);
    const weight = (6 - w.lvl) + Math.random() * 2; // weaker = higher
    return { w, weight };
  }).sort((a,b) => b.weight - a.weight).map(x => x.w);
}

function lvlLabel(lvl){ return ['Новое','Учу','Учу','Знаю','Знаю','Выучено'][lvl] || 'Новое'; }
function lvlClass(lvl){ if(lvl>=5)return 'done'; if(lvl>=3)return 'mid'; return 'new'; }

// ── STREAK ──
let streak = { count: 0, last: '' };
try { streak = JSON.parse(localStorage.getItem('lx_streak') || '{"count":0,"last":""}'); } catch(e){}

function todayStr() { return new Date().toISOString().slice(0, 10); }

function bumpStreak() {
  const t = todayStr();
  if (streak.last === t) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const continued = streak.last === y;
  streak.count = continued ? streak.count + 1 : 1;
  streak.last = t;
  localStorage.setItem('lx_streak', JSON.stringify(streak));
  if (CS) { try { CS.setItem('lx_streak', JSON.stringify(streak)); } catch(e){} }
  renderStreak();
  showStreakPop(streak.count, continued);
}

let spTimer = null;
function showStreakPop(count, continued) {
  const pop = document.getElementById('streak-pop');
  const num = document.getElementById('sp-num');
  const lbl = document.getElementById('sp-lbl');
  if (count === 1) {
    num.textContent = 'Серия начата!';
    num.style.fontSize = 'clamp(20px,6vw,28px)';
    lbl.textContent = 'Первый день обучения';
  } else {
    num.textContent = count + ' ' + plural(count,'день','дня','дней');
    num.style.fontSize = '';
    lbl.textContent = continued ? 'Серия продолжается!' : 'Новая серия!';
  }
  pop.classList.add('show');
  haptic('ok');
  clearTimeout(spTimer);
  spTimer = setTimeout(hideStreakPop, 3200);
}

function hideStreakPop() {
  document.getElementById('streak-pop').classList.remove('show');
  clearTimeout(spTimer);
}

function renderStreak() {
  const b = document.getElementById('streak-b');
  // streak is alive if last activity was today or yesterday
  const t = todayStr();
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (streak.count > 0 && (streak.last === t || streak.last === y)) {
    b.style.display = 'flex';
    document.getElementById('streak-n').textContent = streak.count;
  } else {
    b.style.display = 'none';
  }
}

      ? '<div class="t9" onclick="applyT9(\'' + esc(res.fullWord) + '\')"><b>' + esc(val.trim()) + '</b><i>' + esc(res.fullWord.slice(typed.length)) + '</i><span class="key">tab</span></div>'

function addWord() {
  const en = document.getElementById('in-en').value.trim();
  if (!en || !selRu) { toast('Выбери перевод'); return; }
  words.push({ id: Date.now(), en, ru: selRu, lvl: 0, seen: 0, correct: 0 });
  save();
  document.getElementById('in-en').value = '';
  document.getElementById('sug-box').style.display = 'none';
  selRu = ''; updSel(); updBtn();
  renderList();
  toast('Добавлено: ' + en);
  haptic('light');
  bumpStreak();
}

function delWord(id) {
  words = words.filter(w => w.id !== id);
  save(); renderList(); toast('Удалено');
}

function renderList() {
  const l = document.getElementById('wlist');
  document.getElementById('cnt').textContent = words.length + ' ' + plural(words.length,'слово','слова','слов');

    l.innerHTML = '<div class="empty"><div class="e-ico">📚</div>Пока пусто.<br>Добавь первое слово!</div>';

// ── QUIZ ──
let inDuel = false;
let quizPool = [];
let quizAnswered = 0;

function saveQuizSession() {
  if (inDuel) return;
  const sess = {
    queue: quizQueue.map(w => w.id),
    qC, qW, quizAnswered,
    ts: Date.now()
  };
  localStorage.setItem('lx_quizsess', JSON.stringify(sess));
}

function clearQuizSession() {
  localStorage.removeItem('lx_quizsess');
}

function loadQuizSession() {
  try {
    const s = JSON.parse(localStorage.getItem('lx_quizsess') || 'null');
    if (!s) return null;
    if (Date.now() - s.ts > 3600000) { clearQuizSession(); return null; } // older than 1h
    // rebuild queue from ids that still exist
    const byId = {};
    words.forEach(w => byId[w.id] = w);
    const queue = s.queue.map(id => byId[id]).filter(Boolean);
    if (queue.length === 0) { clearQuizSession(); return null; }
    return { queue, qC: s.qC, qW: s.qW, quizAnswered: s.quizAnswered };
  } catch(e) { return null; }
}

function initQuiz(duel, forceNew) {
  inDuel = !!duel;
  const pool = (duel && duelWords) ? duelWords : words;
  quizPool = pool;
  // try resume saved session (only for normal mode)
  if (!duel && !forceNew) {
    const s = loadQuizSession();
    if (s) {
      quizQueue = s.queue;
      qC = s.qC; qW = s.qW; quizAnswered = s.quizAnswered;
      updQ(); nextQ();
      return;
    }
  }
  qC = 0; qW = 0; quizAnswered = 0;
  quizQueue = duel ? shuffle([...pool]) : srsOrder(pool);
  clearQuizSession();
  updQ(); nextQ();
}

function nextQ() {
  const b = document.getElementById('q-body');
  const activePool = (quizPool && quizPool.length ? quizPool : words);
  if (!activePool.length) { b.innerHTML = '<div class="nocards">Сначала добавь слова</div>'; return; }
  if (activePool.length < 2) { b.innerHTML = '<div class="nocards">Нужно хотя бы 2 слова</div>'; return; }
  if (!quizQueue.length) {
    clearQuizSession();
    const total = qC + qW;
    const pct = total ? Math.round(qC/total*100) : 0;
    if (inDuel) {
      b.innerHTML = '<div class="res"><div class="res-e">' + (pct>=70?'🏆':'⚔️') + '</div>' +
        '<div class="res-t">Дуэль завершена!</div>' +
        '<div class="res-s">Твой результат: <b style="color:var(--acc)">' + qC + '/' + total + '</b> (' + pct + '%)</div>' +
        '<div class="res-row"><div class="res-st g"><div class="res-n">' + qC + '</div><div class="res-l">Верно</div></div>' +
        '<div class="res-st r"><div class="res-n">' + qW + '</div><div class="res-l">Ошибки</div></div></div>' +
        '<div class="res-btns"><button class="btn-ghost" onclick="addDuelWords()">+ Добавить слова</button>' +
        '<button class="btn-share" onclick="shareDuelResult(' + qC + ',' + total + ')">📤 Ответить вызовом</button></div></div>';
    } else {
      b.innerHTML = '<div class="res"><div class="res-e">' + (qC >= qW ? '🏆' : '📖') + '</div>' +
        '<div class="res-t">' + (qC >= qW ? 'Класс!' : 'Повтори ещё') + '</div>' +
        '<div class="res-row"><div class="res-st g"><div class="res-n">' + qC + '</div><div class="res-l">Верно</div></div>' +
        '<div class="res-st r"><div class="res-n">' + qW + '</div><div class="res-l">Ошибки</div></div></div>' +
        '<div class="res-btns"><button class="btn-ghost" onclick="initQuiz(false,true)">Снова</button>' +
        '<button class="btn-share" onclick="shareResult(' + qC + ',' + (qC+qW) + ')">📤 Поделиться</button></div></div>';
    }
    return;
  }
  quizDone = false;
  quizQ = quizQueue.pop();
  const others = (quizPool && quizPool.length ? quizPool : words).filter(w => w.id !== quizQ.id);
  ensureSrs(quizQ);
  // typing mode for words the user already knows a bit (lvl>=2), else multiple choice; ~35% typing
  const canType = !inDuel && quizQ.lvl >= 2 && Math.random() < 0.5;
  const spk = '<button class="spk" onclick="speak(\'' + esc(quizQ.en) + '\', event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg></button>';
  const head = '<div class="q-card"><div class="q-sub">' + (canType ? 'Впиши перевод' : 'Переведи') + '</div>' +
    '<div style="display:flex;align-items:center;gap:10px;max-width:100%"><div class="q-word">' + esc(quizQ.en) + '</div>' + spk + '</div></div>';
  if (canType) {
    b.innerHTML =
      '<div style="display:flex;flex-direction:column;gap:12px">' + head +
      '<input class="inp q-type" id="q-type" placeholder="Напиши перевод..." autocomplete="off" oninput="onTypeInput()">' +
      '<div class="q-fb" id="q-fb"></div>' +
      '<div class="center"><button class="btn" id="q-check" onclick="checkType()">Проверить</button>' +
      '<button class="btn-ghost" id="q-n" style="display:none" onclick="nextQ()">Дальше →</button></div></div>';
    setTimeout(() => { const el = document.getElementById('q-type'); if (el) el.focus(); }, 50);
    return;
  }
  const opts = shuffle([quizQ, ...shuffle(others).slice(0, Math.min(3, others.length))]);
  b.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:12px">' + head +
    '<div class="q-opts">' + opts.map(o =>
      '<button class="q-o" onclick="checkQ(this,' + o.id + ')">' + esc(o.ru) + '</button>'
    ).join('') + '</div>' +
    '<div class="q-fb" id="q-fb"></div>' +
    '<div class="center"><button class="btn-ghost" id="q-n" style="display:none" onclick="nextQ()">Дальше →</button></div>' +
    '</div>';
}

function checkQ(btn, id) {
  if (quizDone) return;
  quizDone = true;
  const ok = id === quizQ.id;
  document.querySelectorAll('.q-o').forEach(b => b.style.pointerEvents = 'none');
  const fb = document.getElementById('q-fb');
  if (ok) { btn.classList.add('c'); fb.textContent = '✓ Верно!'; fb.className = 'q-fb g'; qC++; haptic('ok'); }
  else {
    btn.classList.add('w'); fb.textContent = '✗ Правильно: ' + quizQ.ru; fb.className = 'q-fb r'; qW++;
    document.querySelectorAll('.q-o').forEach(b => {
      const m = b.getAttribute('onclick').match(/\d+/);
      if (m && parseInt(m[0]) === quizQ.id) b.classList.add('c');
    });
    haptic('err');
  }
  if (!inDuel) markWord(quizQ.id, ok);
  quizAnswered++;
  saveQuizSession();
  maybeEncourage();
  updQ();
  bumpStreak();
  document.getElementById('q-n').style.display = 'inline-block';
}

function onTypeInput() {
  const el = document.getElementById('q-type');
  const btn = document.getElementById('q-check');
  if (btn) btn.classList.toggle('on', !!el.value.trim());
}

function normRu(s){ return s.toLowerCase().replace(/ё/g,'е').replace(/[^а-я ]/g,'').trim(); }

function checkType() {
  if (quizDone) return;
  const el = document.getElementById('q-type');
  const val = (el.value || '').trim();
  if (!val) return;
  quizDone = true;
  el.disabled = true;
  document.getElementById('q-check').style.display = 'none';
  // accept if matches any of the dictionary translations OR the saved ru (split by comma)
  const accepted = [quizQ.ru, ...(DICT[quizQ.en.toLowerCase()] || [])]
    .join(',').split(/[,;/]/).map(normRu).filter(Boolean);
  const ok = accepted.includes(normRu(val));
  const fb = document.getElementById('q-fb');
  if (ok) { fb.textContent = '✓ Верно!'; fb.className = 'q-fb g'; qC++; haptic('ok'); }
  else { fb.innerHTML = '✗ Правильно: <b>' + esc(quizQ.ru) + '</b>'; fb.className = 'q-fb r'; qW++; haptic('err'); el.classList.add('wrong'); }
  if (!inDuel) markWord(quizQ.id, ok);
  quizAnswered++;
  saveQuizSession();
  maybeEncourage();
  updQ(); bumpStreak();
  document.getElementById('q-n').style.display = 'inline-block';
}

  if (quizAnswered > 5 && quizAnswered % 7 === 0) {
    showCheer('', CHEERS[Math.floor(Math.random() * CHEERS.length)], true);
  }

function renderProfile() {
  const b = document.getElementById('prof-body');
  const learned = words.filter(w => (w.lvl||0) >= 5).length;
  const learning = words.filter(w => (w.lvl||0) >= 1 && (w.lvl||0) < 5).length;
  const fresh = words.filter(w => (w.lvl||0) === 0).length;
  const todayCount = dayLog[todayStr()] || 0;
  const goalPct = Math.min(100, Math.round(todayCount / goalDaily * 100));
  const totalSeen = words.reduce((s,w) => s + (w.seen||0), 0);
  const totalCorrect = words.reduce((s,w) => s + (w.correct||0), 0);
  const acc = totalSeen ? Math.round(totalCorrect / totalSeen * 100) : 0;

  // daily goal ring
  const R = 34, C = 2 * Math.PI * R, off = C * (1 - goalPct/100);
  let h = '<div class="goal-card">' +
    '<svg class="goal-ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="' + R + '" fill="none" stroke="var(--s3)" stroke-width="7"/>' +
    '<circle cx="40" cy="40" r="' + R + '" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '" transform="rotate(-90 40 40)"/>' +
    '<text x="40" y="46" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)" font-family="Unbounded">' + todayCount + '</text></svg>' +
    '<div class="goal-i"><div class="goal-t">Цель на сегодня</div>' +
    '<div class="goal-s">' + todayCount + ' из ' + goalDaily + ' ' + plural(goalDaily,'слово','слова','слов') + (goalPct>=100?' ✓':'') + '</div>' +
    '<div class="goal-set"><button class="gbtn" onclick="setGoal(5)">5</button><button class="gbtn" onclick="setGoal(10)">10</button><button class="gbtn" onclick="setGoal(20)">20</button></div></div></div>';

  // english level badge
  const myLevel = localStorage.getItem('lx_level');
  if (myLevel) {
    const lvlInfo = (typeof LEVEL_INFO !== 'undefined' && LEVEL_INFO[myLevel]) ? LEVEL_INFO[myLevel] : {name: myLevel};
    h += '<div class="lvl-card" onclick="goLevelTest()">' +
      '<div class="lvl-badge2">' + myLevel + '</div>' +
      '<div class="lvl-i"><div class="lvl-t">Твой уровень английского</div>' +
      '<div class="lvl-n">' + esc(lvlInfo.name) + '</div></div>' +
      '<div class="lvl-redo">пройти заново →</div></div>';
  } else {
    h += '<div class="lvl-card empty" onclick="goLevelTest()">' +
      '<div class="lvl-badge2 q">?</div>' +
      '<div class="lvl-i"><div class="lvl-t">Уровень не определён</div>' +
      '<div class="lvl-n">Пройди тест на уровень английского</div></div>' +
      '<div class="lvl-redo">пройти →</div></div>';
  }

  // stats grid
  h += '<div class="stat-grid">' +
    statBox(words.length, 'Всего слов', '') +
    statBox(learned, 'Выучено', 'g') +
    statBox(learning, 'Учу', 'gold') +
    statBox(acc + '%', 'Точность', '') + '</div>';

  // days active this month
  const now = new Date();
  const ym = now.toISOString().slice(0,7); // YYYY-MM
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  let activeDays = 0;
  Object.keys(dayLog).forEach(d => { if (d.startsWith(ym) && dayLog[d] > 0) activeDays++; });
  const monthNames = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
  h += '<div class="month-card">' +
    '<div class="month-big">' + activeDays + '</div>' +
    '<div class="month-i"><div class="month-t">' + plural(activeDays,'день','дня','дней') + ' в боте</div>' +
    '<div class="month-s">в ' + monthNames[now.getMonth()] + ' из ' + daysInMonth + ' ' + plural(daysInMonth,'дня','дней','дней') + '</div></div></div>';

  // achievements
  h += '<div class="sec" style="margin-top:6px">Достижения</div><div class="ach-grid">';
  ACHIEVEMENTS.forEach(a => {
    const got = a.check();
    h += '<div class="ach' + (got?' got':'') + '"><div class="ach-i">' + a.icon + '</div>' +
      '<div class="ach-n">' + a.name + '</div><div class="ach-d">' + a.desc + '</div></div>';
  });
  h += '</div>';

  b.innerHTML = h;
}

// случайная выборка вопросов на каждый запуск: по N с каждого уровня
let LEVEL_Q = [];
function buildLevelTest() {
  // больше вопросов на верхних уровнях, чтобы тест был объективнее и его нельзя было угадать
  const plan = { A1:2, A2:3, B1:4, B2:5, C1:5, C2:5 }; // = 24 вопроса
  LEVEL_Q = [];
  Object.keys(plan).forEach(lvl => {
    const pool = LEVEL_POOL.filter(q => q.lvl === lvl);
    shuffle(pool);
    pool.slice(0, plan[lvl]).forEach(q => {
      const correctText = q.o[q.a];
      const opts = [...q.o];
      shuffle(opts);
      LEVEL_Q.push({ q: q.q, o: opts, a: opts.indexOf(correctText), lvl: q.lvl });
    });
  });
}

let ltState = null;

function startLevelTest() {
  buildLevelTest();
  ltState = { idx: 0, score: 0, byLvl: {A1:0,A2:0,B1:0,B2:0,C1:0,C2:0}, totalByLvl: {A1:0,A2:0,B1:0,B2:0,C1:0,C2:0}, done: false };
  LEVEL_Q.forEach(q => ltState.totalByLvl[q.lvl]++);
  renderLevelQ();
}

function renderLevelQ() {
  const b = document.getElementById('q-body');
  // hide the launcher bar & duel button during the test
  document.querySelector('.leveltest-bar').style.display = 'none';
  if (ltState.idx >= LEVEL_Q.length) { renderLevelResult(); return; }
  const q = LEVEL_Q[ltState.idx];
  const prog = Math.round(ltState.idx / LEVEL_Q.length * 100);
  b.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<div class="prog"><div class="prog-t"><div class="prog-f" style="width:' + prog + '%"></div></div>' +
    '<div class="prog-m"><span>Вопрос ' + (ltState.idx+1) + ' из ' + LEVEL_Q.length + '</span><span>' + prog + '%</span></div></div>' +
    '<div class="q-card"><div class="q-sub">Тест уровня</div><div class="q-word" style="font-size:clamp(16px,4.6vw,22px);font-family:Inter,sans-serif;font-weight:700">' + esc(q.q) + '</div></div>' +
    '<div class="q-opts" id="lt-opts">' + q.o.map((opt,i) =>
      '<button class="q-o" onclick="answerLevel(' + i + ')">' + esc(opt) + '</button>'
    ).join('') + '</div></div>';
}

let ltLock = false;
function answerLevel(i) {
  if (ltLock) return;
  ltLock = true;
  const q = LEVEL_Q[ltState.idx];
  const opts = document.querySelectorAll('#lt-opts .q-o');
  opts.forEach(o => o.style.pointerEvents = 'none');
  if (i === q.a) {
    opts[i].classList.add('c');
    ltState.score++; ltState.byLvl[q.lvl]++;
    haptic('ok');
  } else {
    opts[i].classList.add('w');
    opts[q.a].classList.add('c');
    haptic('err');
  }
  setTimeout(() => {
    ltLock = false;
    ltState.idx++;
    renderLevelQ();
  }, 750);
}

function computeLevel() {
  // Поднимаемся снизу вверх. Уровень считается "пройденным", если на нём
  // правильных >= 60% (но не меньше: при 2 вопросах нужно 2/2, при 3+ — round(60%)).
  const order = ['A1','A2','B1','B2','C1','C2'];
  let result = 'A1';
  let failedOnce = false;
  for (const lvl of order) {
    const total = ltState.totalByLvl[lvl] || 0;
    if (total === 0) continue;
    const got = ltState.byLvl[lvl] || 0;
    const thresh = (lvl === 'C1' || lvl === 'C2') ? 0.7 : 0.6; // верхние уровни — строже
    const need = total <= 2 ? total : Math.ceil(total * thresh);
    const passed = got >= need;
    if (passed) {
      result = lvl;
      failedOnce = false;
    } else {
      // допускаем один "промах" на уровень выше уже достигнутого, но не два подряд
      if (failedOnce) break;
      failedOnce = true;
    }
  }
  return result;
}

function renderLevelResult() {
  ltState.done = true;
  const lvl = computeLevel();
  const info = LEVEL_INFO[lvl];
  const order = ['A1','A2','B1','B2','C1','C2'];
  const pos = order.indexOf(lvl);
  const fillPct = Math.round((pos + 1) / order.length * 100);
  const b = document.getElementById('q-body');
  b.innerHTML =
    '<div class="lt-result">' +
    '<div class="lt-prog">Твой уровень английского</div>' +
    '<div class="lt-badge">' + lvl + '</div>' +
    '<div class="lt-name">' + esc(info.name) + '</div>' +
    '<div class="lt-bar2"><div class="lt-fill" style="width:' + fillPct + '%"></div></div>' +
    '<div class="lt-scale"><span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span></div>' +
    '<div class="lt-desc">' + esc(info.desc) + '</div>' +
    '<div class="lt-prog">Правильных ответов: ' + ltState.score + ' из ' + LEVEL_Q.length + '</div>' +
    '<div class="res-btns"><button class="btn-ghost" onclick="exitLevelTest()">← К тесту слов</button>' +
    '<button class="btn-share" onclick="shareLevel(\'' + lvl + '\')">📤 Поделиться</button></div>' +
    '</div>';
  // save level to localStorage + cloud, show on the bar next time
  localStorage.setItem('lx_level', lvl);
  if (CS) { try { CS.setItem('lx_level', lvl); } catch(e){} }
  updateLevelBar();
  haptic('ok');
}

function exitLevelTest() {
  ltState = null;
  document.querySelector('.leveltest-bar').style.display = 'flex';
  initQuiz();
}

function shareLevel(lvl) {
  const info = LEVEL_INFO[lvl];
  const txt = '🎯 Мой уровень английского — ' + info.name + '!\n\nА какой у тебя? Проверь в WordFlip 👇';
  if (TG && TG.openTelegramLink) {
    TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(APP_LINK) + '&text=' + encodeURIComponent(txt));
  } else {
    try { navigator.clipboard.writeText(txt + '\n' + APP_LINK); toast('Скопировано!'); } catch(e) { toast(APP_LINK); }
  }
  haptic('light');
}

function updateLevelBar() {
  const lvl = localStorage.getItem('lx_level');
  const sub = document.getElementById('lt-sub');
  if (sub && lvl) sub.textContent = 'Твой уровень: ' + lvl + ' · пройти заново';
}

// ── SHARE & DUEL ──
function shareResult(correct, total) {
  const pct = total ? Math.round(correct / total * 100) : 0;
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🔥' : pct >= 50 ? '💪' : '📚';
  const txt = emoji + ' Я прошёл тест в WordFlip!\n\n' +
    '✅ ' + correct + ' из ' + total + ' (' + pct + '%)\n' +
    (streak.count > 1 ? '🔥 Серия: ' + streak.count + ' ' + plural(streak.count,'день','дня','дней') + '\n' : '') +
    '\nУчи английские слова вместе со мной 👇';
  const botLink = APP_LINK;
  if (TG && TG.openTelegramLink) {
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(botLink) + '&text=' + encodeURIComponent(txt);
    TG.openTelegramLink(url);
  } else {
    // fallback: copy to clipboard
    try {
      navigator.clipboard.writeText(txt + '\n' + botLink);
      toast('Скопировано — отправь друзьям!');
    } catch(e) { toast('Поделись ссылкой: ' + botLink); }
  }
  haptic('light');
}

function addDuelWords() {
  if (!duelWords) return;
  let added = 0;
  duelWords.forEach(d => {
    if (!words.some(w => w.en.toLowerCase() === d.en.toLowerCase())) {
      words.push({ id: Date.now() + Math.random(), en: d.en, ru: d.ru, lvl: 0, seen: 0, correct: 0 }); added++;
    }
  });
  if (added) { save(); renderList(); toast('Добавлено ' + added + ' ' + plural(added,'слово','слова','слов')); haptic('ok'); }
  else toast('Все слова уже есть');
}

function shareDuelResult(correct, total) {
  // respond with own duel from own words
  startDuel();
}

function startDuel() {
  if (words.length < 4) { toast('Нужно минимум 4 слова для дуэли'); return; }
  // pick 5 random words, encode into a share link
  const pool = shuffle([...words]).slice(0, 5).map(w => w.en + '|' + w.ru);
  const payload = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(pool)))));
  const link = APP_LINK + '?duel=' + payload;
  const txt = '⚔️ Вызываю тебя на дуэль в WordFlip!\n\nПройди тест из моих слов и узнай, кто переведёт точнее 👇';
  if (TG && TG.openTelegramLink) {
    TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(txt));
  } else {
    try { navigator.clipboard.writeText(txt + '\n' + link); toast('Ссылка на дуэль скопирована!'); }
    catch(e) { toast('Поделись ссылкой на дуэль'); }
  }
  haptic('mid');
}

// detect incoming duel from start param
function checkDuel() {
  let payload = null;
  // from Telegram start_param
  if (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param && TG.initDataUnsafe.start_param.startsWith('duel')) {
    payload = TG.initDataUnsafe.start_param.replace('duel','');
  }
  // from URL ?duel=
  const m = location.search.match(/[?&]duel=([^&]+)/);
  if (m) payload = m[1];
  if (!payload) return false;
  try {
    const arr = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(payload)))));
    duelWords = arr.map(s => { const [en, ru] = s.split('|'); return { id: Math.random(), en, ru }; });
    return duelWords.length >= 2;
  } catch(e) { return false; }
}

let duelWords = null;

// ── UTILS ──
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function plural(n,a,b,c){n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return c;if(d>1&&d<5)return b;if(d==1)return a;return c}
function haptic(t){
  if(!TG||!TG.HapticFeedback)return;
  try{
    if(t==='sel')TG.HapticFeedback.selectionChanged();
    else if(t==='light')TG.HapticFeedback.impactOccurred('light');
    else if(t==='mid')TG.HapticFeedback.impactOccurred('medium');
    else if(t==='ok')TG.HapticFeedback.notificationOccurred('success');
    else if(t==='err')TG.HapticFeedback.notificationOccurred('error');
    else if(t==='warn')TG.HapticFeedback.notificationOccurred('warning');
  }catch(e){}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
